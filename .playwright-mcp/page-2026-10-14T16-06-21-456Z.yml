              - generic [ref=f10e174]:
                - heading "Dr. Y. V. Narayana" [level=3] [ref=f10e175]
                - generic [ref=f10e176]: M.Tech, Ph.D, FIE
                - generic [ref=f10e177]: Principal, Tirumala Engineering College • Fellow of Institution of Engineers (FIE)
                - blockquote [ref=f10e178]: "\"The only place where success comes before work is in the dictionary. At TEC, we instill in our students the perseverance to turn aspirations into reality.\""
                - heading "Principal's Message to Technocrats:" [level=4] [ref=f10e179]
                - paragraph [ref=f10e180]: Welcome to Tirumala Engineering College! As an autonomous institution permanently affiliated to JNTUK and accredited by NAAC with 'A' Grade, our mission is to deliver comprehensive technical education that bridges classroom fundamentals with industrial applications. Our dedicated faculty, advanced laboratories, research cells, and proactive placement cell ensure that every student graduates with professional competence and ethical grounding.
                - paragraph [ref=f10e181]: At TEC, we believe that education must transcend textbooks. Our campus buzzes with technical symposiums (Prayaga), Applied Robotics training in collaboration with European institutes, IEEE student branch activities, and round-the-clock digital library resources. We look forward to partnering with you on your journey towards technical leadership.
            - generic [ref=f10e182]:
              - heading "Key Institutional Milestones Achieved Under Dr. Y. V. Narayana's Tenure:" [level=4] [ref=f10e183]
              - list [ref=f10e184]:
                - listitem [ref=f10e185]: Conferred Autonomous Status by UGC and Affiliated University JNTUK.
                - listitem [ref=f10e186]: Accredited with 'A' Grade by National Assessment and Accreditation Council (NAAC).
                - listitem [ref=f10e187]: National Board of Accreditation (NBA) recognition for eligible B.Tech programmes.
                - listitem [ref=f10e188]: Highest campus placement tally crossing 864+ selections in a single academic year.
                - listitem [ref=f10e189]: Establishment of APSSDC Skill Hub and European standard Applied Robot Control (ARC) Lab.
