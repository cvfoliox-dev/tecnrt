    - generic [ref=e208]:
      - heading "Origin Of the COllege" [level=2] [ref=e209]
      - generic [ref=e211]:
        - paragraph [ref=e212]: Once, a dry and bleak area, Narasaraopet Division has transformed itself into a vast lush green vista; thanks to Nagarjuna Sagar waters. The green revolution has, in its turn, spawned the white as well as knowledge revolution. That explains the phenomenon of a phalanx of academic and technological institutes in and around Narasaraopet.
        - paragraph [ref=e213]: You are welcome to Tirumala Engineering College. Though a late starter, the Institution has emerged into a front-runner in the field of technical education. It has become a preferred destination for merit students and career- conscious faculty. In a short span of 8 years, it has discovered itself into an engineering institute, par-excellence.
        - paragraph [ref=e214]: Founded and funded in 2008 by Tirumala Milk Products Pvt. Ltd., an entrepreneurial marvel, the institute was set up on a 16 acre strip girdled by a lush green picturesque landscape. The pastoral environs provide a tranquil ambience for an unruffled pursuit of knowledge.
        - paragraph [ref=e215]: The Tirumala Milk Products Pvt. Ltd is stewarded by five humble sons of the soil, moderately educated, but fired by a sprit of enterprise. In a short span of 15 years, the Dairy Group expanded its transactions to all the four Southern states and ushered into one of the Mega-Industrial Houses. With its varied milk products, its annual turnover has astonishingly shot up to Rs:1500 Crores. Foreign investors, too, have started showing keen interest in the Dairy. IIM Students have come down to study this marvel of rular initiative. Their business preoccupations notwithstanding, the dairy management had always been conscious that the tremendous breakthrough they had achieved was made possible by the cooperation of the humble dairy farmers who formed the backbone of their industry. This nagging sense of gratitude is what inspired them to set up an Engineering College in the vicinity of their origins with a view to promoting technical education for faster growth among their rural brethren.
        - paragraph [ref=e216]: The management's vision of transforming the college into a center of excellence has come true in its short existence of 8 years. The growing strength of the college, EAMCET students' preference for this college, rush for management quota seats, lucrative placements--all these go to vindicate the popular esteem it enjoys. R&D guidance by experienced professors, placement training under veteran corporate trainers, campus interviews spread over the whole of final year, a well staffed and richly equipped English department to enrich communication skills, a galore of workshops and presentation seminars all through, and above all a disciplined academic ambience - are some of the features that the college can justly be proud of. The college has come to carve a special nich for itself in the university arena thanks to the combined efforts of its vibrant staff and dynamic principal.
        - paragraph [ref=e217]: Right now, the college offers four year B.Tech of CIVIL, MECHANICAL, EEE, ECE, CSE
    - generic [ref=e219]:
      - heading "Vision and Mission of the Institute" [level=2] [ref=e222]
      - generic [ref=e223]:
        - generic [ref=e224]:
          - heading "Vision" [level=3] [ref=e225]
          - paragraph [ref=e226]: To be a world class leader in transforming lives through an innovative, rigorous and compassionate approach by imparting high quality academic excellence in technical education to uplift the living standards of the rural youth by promoting the cutting edge technologies, employability, higher education and research with socio-ethical, eco-friendly and entrepreneurial values.
        - generic [ref=e227]:
          - heading "Mission" [level=3] [ref=e228]
          - paragraph [ref=e229]: To develop high quality technical personnel with a sound footing on basic engineering principles, innovative research capabilities and exemplary professional conduct to lead and to use technology for the progress of mankind, training and adepting them to changing technological environment by providing the high quality instruction, infra, faculty, effective teaching and learning methods imbibing socio-ethical, eco-friendly and entrepreneurial values as the inner strength for rural development
        - generic [ref=e230]:
          - heading "Quality Policy" [level=3] [ref=e231]
          - paragraph [ref=e232]: We, at Tirumala Engineering College, Strongly believe that Quality is the essence of life. Hence, TEC will constantly strive to improve the quality of education and training imparted to its students by establishing state-of-the-art laboratories and modernizing them continually, upgrading the knowledge and skills of its staff periodically and developing strong linkages with industry.
